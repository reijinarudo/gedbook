[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gedbook"
version = "0.1.0"
description = "Draft a printable family history book from a GEDCOM file and a folder of photos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reginald Finley" }]
dependencies = [
  "weasyprint==70.0",
  "Jinja2==3.1.6",
  "pillow==12.3.0",
  "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
gedbook = "gedbook.cli:main"

[project.urls]
Homepage = "https://drreginaldfinley.com"

[tool.setuptools]
packages = ["gedbook"]

[tool.setuptools.package-data]
gedbook = ["templates/*"]
